<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>별의 밝기 탐구실 · 중2 과학</title>

<style>
:root{
  --ink:#0B1026; --ink-2:#141B3C; --ink-3:#1E2750;
  --paper:#F5F7FC; --paper-2:#FFFFFF;
  --line-d:rgba(255,255,255,.14); --line-l:#DDE2EE;
  --dim:#98A2C8; --gold:#FFC857; --blue:#9DB4FF;
  --white-s:#E8EEFF; --orange:#FFB067; --coral:#FF7A59; --ok:#4ECBA0;
  --serif:'Gowun Batang',serif;
  --sans:'Noto Sans KR',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--ink);color:var(--white-s);font-family:var(--sans);
  font-size:16px;line-height:1.7;-webkit-text-size-adjust:100%}
.wrap{max-width:900px;margin:0 auto;padding:0 20px 72px}

header{position:relative;overflow:hidden;padding:48px 0 34px;text-align:center}
#stars{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.eyebrow{position:relative;font-family:var(--mono);font-size:12px;letter-spacing:.22em;
  color:var(--gold);text-transform:uppercase;margin:0 0 12px}
h1{position:relative;font-family:var(--serif);font-weight:700;
  font-size:clamp(28px,6vw,42px);line-height:1.25;margin:0 0 10px;color:#fff}
.sub{position:relative;margin:0;color:var(--dim);font-size:14.5px}

nav.tabs{display:flex;gap:4px;margin:0 0 24px;padding:5px;
  background:var(--ink-2);border:1px solid var(--line-d);border-radius:14px}
nav.tabs button{flex:1;padding:11px 4px;border:0;border-radius:10px;cursor:pointer;
  background:transparent;color:var(--dim);font-family:var(--sans);
  font-size:14px;font-weight:500;transition:background .18s,color .18s}
nav.tabs button:hover{color:var(--white-s)}
nav.tabs button[aria-selected="true"]{background:var(--gold);color:#241A00;font-weight:700}
nav.tabs button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
section[role="tabpanel"][hidden]{display:none}

.card{background:var(--paper);color:#101632;border-radius:16px;padding:24px;margin:0 0 18px}
.card.dark{background:var(--ink-2);color:var(--white-s);border:1px solid var(--line-d)}
h2{font-family:var(--serif);font-size:21px;font-weight:700;margin:0 0 6px;line-height:1.35}
h3{font-size:14.5px;font-weight:700;margin:22px 0 10px}
h3:first-child{margin-top:0}
.lede{margin:0 0 16px;font-size:14.5px;color:#4A5375}
.card.dark .lede{color:var(--dim)}
.step{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.14em;
  color:#8A93B4;margin:0 0 4px}
.card.dark .step{color:var(--dim)}

.chips{display:inline-flex;flex-wrap:wrap;gap:4px;padding:4px;background:#E9EDF6;border-radius:10px}
.card.dark .chips{background:var(--ink-3)}
.chips button{padding:7px 13px;border:0;border-radius:7px;background:transparent;cursor:pointer;
  color:#5A6488;font-family:var(--sans);font-size:13.5px;font-weight:500}
.card.dark .chips button{color:var(--dim)}
.chips button[aria-pressed="true"]{background:var(--paper-2);color:#101632;font-weight:700}
.card.dark .chips button[aria-pressed="true"]{background:var(--gold);color:#241A00}
.chips button:focus-visible{outline:2px solid #4A6FE3;outline-offset:1px}
.fieldrow{margin:0 0 16px}
.fieldrow>label{display:block;font-size:13px;font-weight:700;color:#5A6488;margin:0 0 7px}
.card.dark .fieldrow>label{color:var(--dim)}
input.text{width:100%;padding:11px 13px;border:1px solid var(--line-l);border-radius:9px;
  font-family:var(--sans);font-size:15px;background:var(--paper-2);color:#101632}
input.text:focus{outline:2px solid #4A6FE3;outline-offset:-1px;border-color:transparent}
.card.dark input.text{background:var(--ink);border-color:var(--line-d);color:var(--white-s)}

table.data{width:100%;border-collapse:collapse;font-family:var(--mono)}
table.data th{font-family:var(--sans);font-size:11.5px;font-weight:700;color:#5A6488;
  text-align:center;padding:0 4px 8px;border-bottom:1px solid var(--line-l)}
table.data th:first-child{text-align:left}
table.data td{padding:5px 3px}
